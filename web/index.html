<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111318">
<title>Earshot</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb; --red:#e5484d; --accent:#3b82f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111318; --card:#1a1d24; --fg:#e8eaf0; --muted:#8b93a3; --line:#2a2f3a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 22px; margin: 0; display:flex; align-items:center; gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .pill { font-size:13px; padding:4px 10px; border-radius:999px; background:var(--line); color:var(--muted); }
  .pill.on { background:var(--red); color:#fff; }
  .pill.on::before { content:"● "; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.3 } }
  button { font:inherit; border:0; border-radius:10px; padding:10px 16px; cursor:pointer;
           background:var(--accent); color:#fff; }
  button.stop { background:var(--red); }
  button.ghost { background:transparent; color:var(--muted); padding:6px 8px; }
  audio { width:100%; margin-top:12px; }
  .muted { color:var(--muted); font-size:14px; }
  ul { list-style:none; margin:0; padding:0; }
  li { border-top:1px solid var(--line); padding:10px 0; }
  li:first-child { border-top:0; }
  li .name { font-variant-numeric: tabular-nums; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>👂 Earshot <span id="pill" class="pill">idle</span></h1>

  <section class="card">
    <div class="row">
      <div>
        <div id="since" class="muted">Not recording</div>
        <div id="listeners" class="muted"></div>
      </div>
      <button id="toggle">Start</button>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <strong>Live</strong>
      <button id="live" class="ghost">▶ Listen</button>
    </div>
    <audio id="livePlayer" controls hidden></audio>
  </section>

  <section class="card">
    <div class="row"><strong>Recordings</strong><button id="refresh" class="ghost">↻</button></div>
    <ul id="recs"></ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let state = { recording: false };

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

function fmtSize(b) { return b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.round(b / 1e3) + " KB"; }
function fmtName(n) { return n.replace(".opus", "").replace("_", " ").replace(/-(\d\d)-(\d\d)$/, ":$1:$2"); }

function render(s) {
  state = s;
  $("pill").textContent = s.recording ? "recording" : "idle";
  $("pill").className = "pill" + (s.recording ? " on" : "");
  $("toggle").textContent = s.recording ? "Stop" : "Start";
  $("toggle").className = s.recording ? "stop" : "";
  $("since").textContent = s.recording ? "Since " + new Date(s.since).toLocaleString() : "Not recording";
  $("listeners").textContent = s.recording ? s.listeners + " live listener(s)" : "";
}

async function refreshStatus() { try { render(await api("/api/status")); } catch {} }

async function refreshRecs() {
  const recs = await api("/api/recordings");
  const ul = $("recs");
  ul.replaceChildren();
  if (!recs.length) { ul.innerHTML = '<li class="muted">No recordings yet</li>'; return; }
  for (const r of recs) {
    const li = document.createElement("li");
    li.innerHTML = `<div class="row">
        <span class="name">${fmtName(r.name)}${r.live ? ' <span class="pill on">now</span>' : ""}</span>
        <span class="muted">${fmtSize(r.size)}
          <a class="muted" href="/rec/${r.name}" download>⤓</a>
          ${r.live ? "" : '<button class="ghost del">✕</button>'}</span>
      </div>`;
    li.querySelector(".name").onclick = () => {
      const existing = li.querySelector("audio");
      if (existing) { existing.remove(); return; }
      const a = document.createElement("audio");
      a.controls = true; a.preload = "metadata"; a.src = "/rec/" + r.name;
      li.append(a); a.play();
    };
    const del = li.querySelector(".del");
    if (del) del.onclick = async () => {
      if (!confirm("Delete " + fmtName(r.name) + "?")) return;
      await api("/api/recordings/" + r.name, { method: "DELETE" });
      refreshRecs();
    };
    ul.append(li);
  }
}

$("toggle").onclick = async () => {
  $("toggle").disabled = true;
  try { render(await api(state.recording ? "/api/stop" : "/api/start", { method: "POST" })); }
  catch (e) { alert(e.message); }
  $("toggle").disabled = false;
  setTimeout(refreshRecs, 1500);
};

$("live").onclick = () => {
  const p = $("livePlayer");
  if (!p.hidden) { p.pause(); p.removeAttribute("src"); p.load(); p.hidden = true; $("live").textContent = "▶ Listen"; return; }
  if (!state.recording) { alert("Start recording first"); return; }
  p.src = "/live.mp3?t=" + Date.now();
  p.hidden = false; p.play();
  $("live").textContent = "■ Stop listening";
};

$("refresh").onclick = refreshRecs;
refreshStatus(); refreshRecs();
setInterval(refreshStatus, 3000);
setInterval(refreshRecs, 30000);
</script>
</body>
</html>
